name: Build Windows EXE and Publish Release

on:
  workflow_dispatch:            # Manual trigger: Actions -> Run workflow
  push:
    tags:
      - 'v*'                    # Auto trigger on tag push, e.g. v1.0.0

permissions:
  contents: write               # Needed to publish GitHub Release

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Generate ICO from PNG (if missing)
        run: |
          python -c "from PIL import Image; Image.open('imgs/ic_xue_xi.png').convert('RGBA').save('imgs/ic_xue_xi.ico', sizes=[(16,16),(32,32),(48,48),(64,64),(128,128),(256,256)])"

      - name: Inject version into build
        # 版本号：tag 推送(如 v1.2.3)用 tag 名；手动触发用 dev。
        # 生成 _version.py 烧录进 exe——不能依赖运行环境变量：exe 启动时
        # os.environ 读的是用户电脑的环境变量，构建时的 env 已丢失，版本会永远显示 dev。
        shell: bash
        run: |
          VERSION="${{ github.ref_type == 'tag' && github.ref_name || 'dev' }}"
          printf "APP_VERSION = '%s'\n" "$VERSION" > _version.py
          echo "Injected version: $VERSION"

      - name: Build single-file EXE
        run: |
          pyinstaller --onefile --windowed --icon=imgs/ic_xue_xi.ico --name "SJJ-COM-Tool" --add-data "imgs/ic_xue_xi.png;imgs" --hidden-import=_version sjj_com_tool.py

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: SJJ-COM-Tool-windows-x64
          path: dist/SJJ-COM-Tool.exe

      - name: Publish Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/SJJ-COM-Tool.exe
          generate_release_notes: true
